<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primarni SEO naslov i opis -->
    <title>Maja Topčagić — Portrait & Fashion Photographer</title>
    <meta
      name="description"
      content="Independent portrait and fashion photographer based in Sarajevo. Over a decade of visual storytelling focused on natural light, authentic character, and raw emotion."
    />
    <meta name="author" content="Maja Topčagić" />
    <meta name="theme-color" content="#080808" />

    <!-- Favicon (stavi sliku direktno u /public folder) -->
    <link rel="icon" type="image/webp" href="studio-maja-logo.webp" />

    <!-- Open Graph / Facebook / Instagram / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Maja Topčagić — Portrait & Fashion Photographer"
    />
    <meta
      property="og:description"
      content="Expressive portraits, commercial campaigns, and photography education based in Sarajevo."
    />
    <meta property="og:image" content="/images/og-cover.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Maja Topčagić — Portrait & Fashion Photographer"
    />
    <meta
      name="twitter:description"
      content="Visual storytelling focused on natural light, authentic character, and raw emotion."
    />
    <meta name="twitter:image" content="/images/og-cover.jpg" />

    <!-- Google Fonts: Samo font koji se stvarno koristi u projektu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
